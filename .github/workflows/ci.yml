name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # A document push must not interrupt an active production publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      base: ${{ steps.plan.outputs.base }}
      paths: ${{ steps.plan.outputs.paths }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The classifier uses the existing TypeScript parser; no install hooks needed.
      - run: npm ci --ignore-scripts
      - id: plan
        run: node scripts/ci/plan.mjs
  build:
    needs: changes
    # A failed classifier must fail this job, which fails the required check below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful, known validation scope
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          PLAN_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          test "$PLAN_RESULT" = success
          case "$PLAN_PROFILE" in docs|content|full) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Document gate (no product build or publication)
        if: needs.changes.outputs.profile == 'docs'
        env:
          CI_BASE_SHA: ${{ needs.changes.outputs.base }}
          CI_CHANGED_PATHS: ${{ needs.changes.outputs.paths }}
        run: |
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          node scripts/ci/docs-check.mjs
      - run: npm ci
        if: needs.changes.outputs.profile != 'docs'
      - name: Dependency audit (high/critical fails)
        if: needs.changes.outputs.profile != 'docs'
        run: npm audit --audit-level=high
      - run: npm run check
        if: needs.changes.outputs.profile != 'docs'
      - name: Ensure MP3 decoder is available
        if: needs.changes.outputs.profile != 'docs'
        # A stalled package mirror must not hold or fail the job: the decode step
        # falls back to the browser decoder when ffmpeg could not be installed.
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt_options='-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
            timeout 180 sudo apt-get $apt_options update || true
            timeout 90 sudo apt-get $apt_options install -y --no-install-recommends ffmpeg || true
          fi
          ffmpeg -version || echo 'ffmpeg unavailable; changed audio will be decoded by the browser.' >> "$GITHUB_STEP_SUMMARY"
      - name: Decode all identified changed audio
        if: needs.changes.outputs.profile != 'docs'
        env:
          CI_CHANGED_PATHS: ${{ needs.changes.outputs.paths }}
        run: node scripts/ci/media-check.mjs
      - run: npm run build
        if: needs.changes.outputs.profile != 'docs'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run perf:bundle
        if: needs.changes.outputs.profile != 'docs'
      # This real-build test checks image inventory, all image SHA, representative
      # cards, download/resume and true offline reload for content as well as code.
      - run: npm run test:images
        if: needs.changes.outputs.profile != 'docs'
      # Pull requests need the same build for the parallel browser suites; main also publishes it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.changes.outputs.profile == 'full' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.profile != 'docs')
        with:
          name: site-dist
          path: dist
          retention-days: 3
          if-no-files-found: error
  # Full-profile browser suites run side by side against the one build above.
  browser:
    needs: [changes, build]
    if: needs.changes.outputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, inference, pwa, ux, navigation, srs-layout, 'pwa:updates']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - run: npm run test:${{ matrix.suite }}
  # Stable required check: passes only when every applicable gate above passed.
  check:
    needs: [changes, build, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          PLAN_PROFILE: ${{ needs.changes.outputs.profile }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          case "$PLAN_PROFILE" in
            full) test "$BROWSER_RESULT" = success ;;
            docs|content) test "$BROWSER_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
  # Keep the required check name present even when Windows UI is not applicable.
  ux-windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Report validation scope
        if: needs.changes.outputs.profile != 'full'
        shell: bash
        run: echo 'Windows UI not exercised for this profile; Linux content/document checks remain required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        if: needs.changes.outputs.profile == 'full'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.profile == 'full'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.profile == 'full'
      - run: node --test tests/static-file.test.mjs tests/page-history.test.mjs
        if: needs.changes.outputs.profile == 'full'
      - run: npm run build
        if: needs.changes.outputs.profile == 'full'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run test:ux -- --area context
        if: needs.changes.outputs.profile == 'full'
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
      - run: npm run test:ux -- --area downloads
        if: needs.changes.outputs.profile == 'full'
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
      - run: npm run test:navigation
        if: needs.changes.outputs.profile == 'full'
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
  deploy-worker:
    # 網頁與同步 API 一起發布到 nihongo-sync Worker（路徑維持 /nihongo-lab/），session 用 HttpOnly cookie。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.profile != 'docs'
    needs: [changes, check, ux-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: nihongo-worker-publication
      cancel-in-progress: false
    steps:
      - name: Require owner and main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: worker/public/nihongo-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Worker 會打包 lib/ 裡的程式，需要 ts-fsrs 等相依套件。
      - run: npm ci
      - name: Publish Worker with web assets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -f public/nihongo-lab/index.html
          # wrangler 會印出設定的 vars；輸出只保留結果，不在 log 留原文。
          if npx --yes wrangler@4.152.0 deploy --config wrangler.toml > ../wrangler.log 2>&1; then
            echo "WORKER_PUBLICATION deployed"
          else
            echo "WORKER_PUBLICATION failed"
            # 只印錯誤段落找原因；本 Worker 的 vars 只有公開的 Google Client ID，secret 不會出現在 wrangler 輸出。
            grep -E -A20 '\[ERROR\]|✘' ../wrangler.log | head -60 || echo "(wrangler 沒有輸出可辨識的錯誤段落)"
            exit 1
          fi

  deploy-pages-redirect:
    # 舊 GitHub Pages 網址只放引導頁：清除舊 token、讓舊 service worker 自行解除、提供進度下載。
    # 必須在 Worker 發布成功後才換，避免新站還沒上線就把舊站拿掉。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build guide page from template
        env:
          NIHONGO_APP_URL: ${{ vars.NIHONGO_APP_URL }}
        run: |
          # 只接受 workers.dev 的 /nihongo-lab/ 網址；字元限制也讓 sed 替換不受特殊字元影響。
          if ! printf '%s' "$NIHONGO_APP_URL" | grep -Eq '^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev/nihongo-lab/$'; then
            echo "NIHONGO_APP_URL must be https://<worker>.<subdomain>.workers.dev/nihongo-lab/"
            exit 1
          fi
          mkdir -p site
          sed "s#__APP_URL__#${NIHONGO_APP_URL}#g" pages-redirect/index.html > site/index.html
          cp pages-redirect/sw.js site/sw.js
          if grep -q '__APP_URL__' site/index.html; then echo "placeholder not replaced"; exit 1; fi
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
